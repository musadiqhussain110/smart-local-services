services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ../../
      dockerfile: services/api/Dockerfile
    env_file:
      - ../../services/api/.env.example
    environment:
      MONGO_URI: mongodb://mongo:27017/serviceshub
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'
    depends_on:
      - mongo

  ai:
    build:
      context: ../../services/ai
      dockerfile: Dockerfile
    ports:
      - '8000:8000'

volumes:
  mongo_data:
